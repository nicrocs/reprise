<svg width="420" height="900" viewBox="0 0 420 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Layered dreadnought acoustic guitar SVG</title>
  <desc id="desc">A simple layered SVG acoustic guitar inspired by a natural-top dreadnought guitar. Groups can be revealed progressively in an app.</desc>

  <defs>
    <linearGradient id="topWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4bf62" />
      <stop offset="42%" stop-color="#ffe39a" />
      <stop offset="58%" stop-color="#ffe39a" />
      <stop offset="100%" stop-color="#e7a64d" />
    </linearGradient>

    <linearGradient id="neckWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b160d" />
      <stop offset="50%" stop-color="#573018" />
      <stop offset="100%" stop-color="#241008" />
    </linearGradient>

    <linearGradient id="bridgeWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1309" />
      <stop offset="50%" stop-color="#63351b" />
      <stop offset="100%" stop-color="#2a1309" />
    </linearGradient>

    <radialGradient id="soundholeDepth" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1b0b05" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Reveal order suggestion:
       1. body
       2. neck
       3. headstock
       4. soundhole
       5. bridge
       6. frets
       7. inlays
       8. tuners
       9. strings
       10. pickguard
       11. detail-lines
  -->

  <g id="guitar" filter="url(#softShadow)">
    <g id="body">
      <path id="body-shape" d="
        M210 405
        C172 405 130 421 107 457
        C84 493 83 535 93 571
        C103 607 82 646 68 687
        C52 734 66 795 104 828
        C133 854 172 862 210 862
        C248 862 287 854 316 828
        C354 795 368 734 352 687
        C338 646 317 607 327 571
        C337 535 336 493 313 457
        C290 421 248 405 210 405
        Z" fill="url(#topWood)" stroke="#171717" stroke-width="7" stroke-linejoin="round" />
      <path id="body-binding" d="
        M210 413
        C174 413 135 428 114 462
        C93 496 92 534 101 568
        C112 608 89 648 77 690
        C62 738 76 791 111 821
        C138 845 176 853 210 853
        C244 853 282 845 309 821
        C344 791 358 738 343 690
        C331 648 308 608 319 568
        C328 534 327 496 306 462
        C285 428 246 413 210 413
        Z" fill="none" stroke="#f7e6b4" stroke-width="3" opacity="0.85" />
    </g>

    <g id="detail-lines" opacity="0.18">
      <path d="M118 438 C109 520 108 730 124 843" stroke="#9b6a27" stroke-width="1" fill="none" />
      <path d="M148 418 C140 515 141 755 154 856" stroke="#9b6a27" stroke-width="1" fill="none" />
      <path d="M180 408 C176 535 177 763 183 861" stroke="#9b6a27" stroke-width="1" fill="none" />
      <path d="M210 406 L210 862" stroke="#9b6a27" stroke-width="1" fill="none" />
      <path d="M240 408 C244 535 243 763 237 861" stroke="#9b6a27" stroke-width="1" fill="none" />
      <path d="M272 418 C280 515 279 755 266 856" stroke="#9b6a27" stroke-width="1" fill="none" />
      <path d="M302 438 C311 520 312 730 296 843" stroke="#9b6a27" stroke-width="1" fill="none" />
    </g>

    <g id="neck">
      <path id="neck-back" d="M181 147 L239 147 L235 458 L185 458 Z" fill="#21100a" />
      <rect id="fretboard" x="176" y="148" width="68" height="405" rx="2" fill="url(#neckWood)" stroke="#100804" stroke-width="3" />
    </g>

    <g id="headstock">
      <path d="
        M165 43
        C181 31 196 36 210 26
        C224 36 239 31 255 43
        L249 132
        C243 148 232 156 222 161
        L198 161
        C188 156 177 148 171 132
        Z" fill="#080604" stroke="#050302" stroke-width="4" />
      <path d="M187 61 C202 54 218 54 233 61" fill="none" stroke="#d7bd6a" stroke-width="4" stroke-linecap="round" opacity="0.9" />
      <text x="210" y="84" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="700" fill="#d8bd68">E</text>
      <path d="M201 117 L210 98 L219 117 Z" fill="#d8bd68" opacity="0.9" />
      <rect x="184" y="139" width="52" height="10" fill="#eee5c5" />
    </g>

    <g id="tuners">
      <g fill="#c8c8c0" stroke="#111" stroke-width="2">
        <circle cx="178" cy="71" r="8" />
        <circle cx="176" cy="101" r="8" />
        <circle cx="178" cy="131" r="8" />
        <circle cx="242" cy="71" r="8" />
        <circle cx="244" cy="101" r="8" />
        <circle cx="242" cy="131" r="8" />
      </g>
      <g fill="#1a1a1a" stroke="#080808" stroke-width="2">
        <ellipse cx="145" cy="71" rx="12" ry="17" />
        <ellipse cx="144" cy="101" rx="12" ry="17" />
        <ellipse cx="145" cy="131" rx="12" ry="17" />
        <ellipse cx="275" cy="71" rx="12" ry="17" />
        <ellipse cx="276" cy="101" rx="12" ry="17" />
        <ellipse cx="275" cy="131" rx="12" ry="17" />
      </g>
      <g stroke="#111" stroke-width="4" stroke-linecap="round">
        <path d="M170 71 L151 71" />
        <path d="M168 101 L151 101" />
        <path d="M170 131 L151 131" />
        <path d="M250 71 L269 71" />
        <path d="M252 101 L269 101" />
        <path d="M250 131 L269 131" />
      </g>
    </g>

    <g id="frets">
      <g stroke="#d8d8d8" stroke-width="2">
        <line x1="177" y1="174" x2="243" y2="174" />
        <line x1="177" y1="203" x2="243" y2="203" />
        <line x1="177" y1="232" x2="243" y2="232" />
        <line x1="177" y1="261" x2="243" y2="261" />
        <line x1="177" y1="290" x2="243" y2="290" />
        <line x1="177" y1="319" x2="243" y2="319" />
        <line x1="177" y1="348" x2="243" y2="348" />
        <line x1="177" y1="377" x2="243" y2="377" />
        <line x1="177" y1="406" x2="243" y2="406" />
        <line x1="177" y1="435" x2="243" y2="435" />
        <line x1="177" y1="464" x2="243" y2="464" />
        <line x1="177" y1="493" x2="243" y2="493" />
        <line x1="177" y1="522" x2="243" y2="522" />
      </g>
    </g>

    <g id="inlays" fill="#f4ead3" stroke="#cfc2a5" stroke-width="1">
      <circle cx="210" cy="217" r="5" />
      <circle cx="210" cy="275" r="5" />
      <circle cx="210" cy="333" r="5" />
      <circle cx="197" cy="391" r="5" />
      <circle cx="223" cy="391" r="5" />
      <circle cx="210" cy="449" r="5" />
      <circle cx="210" cy="507" r="5" />
    </g>

    <g id="soundhole">
      <circle cx="210" cy="548" r="57" fill="#f4cf82" />
      <circle cx="210" cy="548" r="51" fill="none" stroke="#101010" stroke-width="4" />
      <circle cx="210" cy="548" r="43" fill="none" stroke="#edcd82" stroke-width="4" />
      <circle cx="210" cy="548" r="36" fill="url(#soundholeDepth)" />
    </g>

    <g id="pickguard">
      <path d="
        M254 505
        C289 511 316 540 321 580
        C325 615 311 653 287 683
        C275 697 259 706 243 704
        C228 702 220 691 221 674
        C223 648 236 619 241 589
        C246 558 244 528 254 505
        Z" fill="#060606" opacity="0.98" />
    </g>

    <g id="bridge">
      <path d="M133 721 L287 721 L287 753 C263 751 245 758 210 758 C175 758 157 751 133 753 Z" fill="url(#bridgeWood)" />
      <rect x="170" y="728" width="80" height="7" rx="2" fill="#eee5c5" />
      <g fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1">
        <circle cx="178" cy="747" r="5" />
        <circle cx="191" cy="747" r="5" />
        <circle cx="204" cy="747" r="5" />
        <circle cx="217" cy="747" r="5" />
        <circle cx="230" cy="747" r="5" />
        <circle cx="243" cy="747" r="5" />
      </g>
    </g>

    <g id="strings" stroke-linecap="round">
      <path d="M180 71 C184 116 183 130 183 148 L178 747" stroke="#e8c059" stroke-width="2.3" />
      <path d="M192 101 C196 126 197 138 197 148 L191 747" stroke="#e8c059" stroke-width="2.1" />
      <path d="M204 131 C207 141 207 145 207 148 L204 747" stroke="#d7d7d7" stroke-width="1.8" />
      <path d="M216 131 C213 141 213 145 213 148 L217 747" stroke="#d7d7d7" stroke-width="1.6" />
      <path d="M228 101 C224 126 223 138 223 148 L230 747" stroke="#d7d7d7" stroke-width="1.4" />
      <path d="M240 71 C236 116 237 130 237 148 L243 747" stroke="#d7d7d7" stroke-width="1.2" />
    </g>
  </g>
</svg>
